android.nonTransitiveRClass=false
android.useAndroidX=true

kotlin.code.style=official
# kotlin.mpp.androidSourceSetLayoutVersion=2 已删除：
#   Android Source Set Layout V2 自 KGP 1.9 / 2.x 起已是默认且不可更改，
#   该属性会被 KGP 判定为「已弃用」并打印 DeprecatedGradleProperty 告警。
#   上游 Aniyomi 只是因为历史原因还留着它，删掉即可，行为完全不变。

org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.parallel=true

# ============================================================
# 内存配置 —— 2026-09-30 踩坑后加固
# ------------------------------------------------------------
# 原值 `-Xmx4g` 在本机（Windows + 大量并行 Worker）实测触发过
# 「Native memory allocation (mmap) failed to map 297795584 bytes.
#   Error detail: G1 virtual space」→ JVM 直接被 OS 杀死，
# 留下 hs_err_pid*.log。
#
# 后果很隐蔽：被杀的 Worker 当时正在给 :domain 写 classes.jar，
# 于是 jar 里只落盘了 17 个条目（全是 R.class），业务类全部丢失。
# 而编译任务标记为成功、后续 :domain:compileDebugKotlin 显示
# UP-TO-DATE，Gradle 不会再生成它 —— 最终表现为 :data 大面积
# 「Unresolved reference」，看起来像源码问题，实为产物损坏。
#
# 修复要点：
#   1. Xmx 降到 3g，给 native heap（Metaspace / code cache /
#      Kotlin 编译器工作区）留出余量；堆不是越大越好。
#   2. 显式设 MaxMetaspaceSize，避免 Metaspace 无上限膨胀。
#   3. 关掉 -XX:+UseCompressedOops 之外的激进调优，保持默认 G1。
#
# 若本机物理内存 >= 32G，可把 -Xmx 调回 4g~6g 并加
# -XX:HeapBaseMinAddress=32G（见崩溃日志建议）。
# ============================================================
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Kotlin 编译器守护进程（与 Gradle 守护进程是不同 JVM，同样吃内存）
kotlin.daemon.jvmargs=-Xmx2g

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# ============================================================
# 本机（Windows）环境适配 —— 个人自用 fork，非上游配置
# ------------------------------------------------------------
# 项目通过 gradle/gradle-daemon-jvm.properties 要求守护进程使用
# 「Eclipse Temurin 17」，默认由 Gradle 从 foojay 自动下载，
# 而最终地址落在 github.com：
#   · 本机 github.com 实测完全不可达（超时）
#   · foojay 直连仅 ~16 KB/s（180MB 需约 3 小时）
# 故改为使用本地已装好的 Temurin 17（取自清华镜像）：
#   D:\Java\temurin-17   (OpenJDK 17.0.20.1, Eclipse Temurin)
#
# installations.paths  : 让 Gradle 在本地发现该 JDK，满足守护进程与
#                        toolchain 的「Temurin 17」要求，无需联网
# auto-download=false  : 禁止任何 toolchain 自动下载，避免卡死后失败
#
# 换机器时：改成本机任意 Temurin 17 的路径即可；若网络能顺畅访问
# github.com，可删掉这两行让 Gradle 自己下载。
# ============================================================
org.gradle.java.installations.paths=D:\\Java\\temurin-17
org.gradle.java.installations.auto-download=false
org.gradle.java.home=D:\\Java\\temurin-17

# 项目路径含中文（D:\VScode\26年\07-animeVenera），AGP 默认会直接报错中止。
# 本项目不使用 NDK，实测可绕过该检查。
# 若后续编译出现资源/路径相关的诡异错误，请把整个项目移到纯英文路径
# （如 D:\dev\animeVenera）并删掉本行。
#
# 注意：AGP 会为这个实验性开关打印一条 "is experimental. The current default is
# 'false'." 的提示。这是 AGP 内部对非默认实验开关的固定行为，无法通过 TOML /
# 参数压制。根治办法只有一个：把项目迁到纯英文路径，然后删掉本行。
android.overridePathCheck=true

# ============================================================
# Kotlin Gradle Plugin 告警抑制
# ------------------------------------------------------------
# 说明：KGP 的抑制键 = 诊断类的「类名」（框架内部取 KClass.simpleName），
# 不是文档里写的描述性名称。下面两个 key 均已通过反编译
# kotlin-gradle-plugin-2.4.0-gradle813.jar 的
# org.jetbrains.kotlin.gradle.plugin.diagnostics.KotlinToolingDiagnostics
# 逐一核对并实测生效。
#
#   1) DeprecatedGradleVersionWarning
#      KGP 2.4 起要求 Gradle >= 8.14.4，本项目用的是 8.13（原因见 wrapper
#      注释：8.13 是第三方插件与 AGP 8.9.1 实测最稳的组合）。这只是「推荐
#      版本」告警——KGP 2.4.0 的实际硬性下限仍是 Gradle 8.11，因此 8.13
#      完全可用，不升级是安全的。
#   2) SourceSetsAccessInAndroidExtension
#      KGP 2.x 弃用 kotlin { sourceSets { ... } }，但 app.cash.sqldelight
#      2.0.2 插件在 :data 模块内部仍会调用它（SqlDelightPlugin.kt:97，
#      用于注册 SQLDelight API 依赖），属于插件侧问题，项目无法自行修正。
#      升到 sqldelight 2.1.x 后才会彻底消失。
#
# 排查问题时若需要看到这些告警，临时删掉本行即可恢复显示。
# ============================================================
kotlin.suppressGradlePluginWarnings=DeprecatedGradleVersionWarning,SourceSetsAccessInAndroidExtension
